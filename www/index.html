<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TETR.IO 패드 프로토타입</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. TETR.IO 게임 화면 (우선 테스트용 iframe) -->
    <div id="game-area">
        <iframe id="tetrio" src="https://tetr.io/" frameborder="0"></iframe>
    </div>

    <!-- 2. 하단 커스텀 버튼 영역 -->
    <div id="pad-area">
        <button class="btn" id="move-left">◀ LEFT</button>
        <button class="btn" id="move-right">RIGHT ▶</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
