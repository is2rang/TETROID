<!-- TETR.IO 게임 레이어 위에 직접 얹어질 가상 컨트롤 패드 구조 -->
<div id="virtual-gamepad">
    <div class="d-pad">
        <button class="ctrl-btn" data-code="ArrowLeft">◀</button>
        <button class="ctrl-btn" data-code="ArrowDown">▼</button>
        <button class="ctrl-btn" data-code="ArrowRight">▶</button>
    </div>
    <div class="action-pad">
        <button class="ctrl-btn" data-code="KeyZ">Z</button>
        <button class="ctrl-btn" data-code="ArrowUp">X</button>
        <button class="ctrl-btn" data-code="Space">DROP</button>
        <button class="ctrl-btn" data-code="ShiftLeft">HOLD</button>
    </div>
</div>
