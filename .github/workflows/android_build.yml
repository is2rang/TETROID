name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Install Dependencies
      run: |
        # 안전하게 Capacitor 핵심 도구를 글로벌로 먼저 설치
        npm install -g @capacitor/cli
        npm install
        
        # 프로젝트 파일 목록을 로그로 출력해서 내역 확인 (디버깅용)
        echo "=== 현재 파일 목록 ==="
        ls -la
        
        # 안드로이드 폴더 강제 생성 및 동기화
        npx cap add android
        npx cap sync

    - name: Verify Android Folder
      run: |
        echo "=== 생성된 파일 목록 ==="
        ls -la
        if [ ! -d "android" ]; then
          echo "에러: android 폴더가 여전히 생성되지 않았습니다!"
          exit 1
        fi

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tetroid-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
