name: Build Android Release APK

on:
  push:
    branches:
      - main  # 또는 master (본인의 주 브랜치 이름으로 변경)
  workflow_dispatch: # GitHub 웹 UI에서 수동으로 빌드를 실행할 수 있게 합니다.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅 및 캐싱 (웹 에셋 빌드용)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 의존성 설치 및 Capacitor 동기화
      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build --if-present # 빌드 스크립트가 있으면 실행 (Vanilla HTML만 있으면 패스됨)

      - name: Capacitor Sync Android
        run: npx cap sync android

      # 4. Java JDK 17 세팅 및 Gradle 캐싱 (안드로이드 컴파일용)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 5. 실행 권한 부여 및 Unsigned Release APK 빌드
      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Unsigned Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 6. Release APK 디지털 서명 (보안 및 설치 가능 상태로 전환)
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 7. 빌드 완료된 서명된 APK를 GitHub Actions 결과물로 업로드
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetrioMobile-Release-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 7 # 7일간 다운로드 가능
