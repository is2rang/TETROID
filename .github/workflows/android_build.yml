name: Android Release Signed Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout 디렉토리 로드
      uses: actions/checkout@v4

    - name: Node.js 환경 설정
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Web Dependencies 설치 및 Build
      run: |
        npm install
        npm run build --if-present

    - name: Java JDK 17 설정
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Gradle 셋업 및 캐시 활성화
      uses: gradle/actions/setup-gradle@v3

    - name: Capacitor 변경사항 안드로이드 프로젝트에 동기화
      run: npx cap sync android

    - name: 안드로이드 Release APK 컴파일
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    # 🚀 오타 제거 및 최신 빌드 툴 버전(34.0.0)을 강제 지정하여 에러 해결
    - name: Android Release APK 서명 인코딩
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: 빌드 및 서명 완료된 정식 APK 저장
      uses: actions/upload-artifact@v4
      with:
        name: tetroid-final-release-apk
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}